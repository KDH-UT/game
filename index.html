<!DOCTYPE html>
<html lang="ko">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 단어 힌트 게임 (정적 사이트 버전)</title>
  <!-- Firebase SDK 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 👉 본인의 Firebase 프로젝트 설정 정보로 수정하세요!
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firebaseFns = { doc, setDoc, getDoc, updateDoc, onSnapshot };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { padding: 20px; background-color: #f4f7f6; text-align: center; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto 20px; }
    button { padding: 10px 18px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; background-color: #4A90E2; color: white; cursor: pointer; margin: 5px; }
    button:hover { background-color: #357ABD; }
    input { padding: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; margin: 5px; width: 80%; max-width: 300px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 메인 선택 화면 -->
  <div id="view-select" class="card">
    <h1>실시간 단어 힌트 게임</h1>
    <p style="margin: 15px 0;">모드를 선택하세요</p>
    <button onclick="showCreateRoom()">1. 방 만들기 (호스트)</button><br>
    <button onclick="showJoinRoom()" style="background-color: #2ECC71;">2. 참가하기</button>
  </div>

  <!-- 방 만들기 화면 -->
  <div id="view-create" class="card hidden">
    <h2>방 개설하기</h2>
    <input type="text" id="input-room-code" placeholder="방 코드 입력 (예: ROOM123)"><br>
    <input type="number" id="input-teams-count" value="4" min="1" max="10" placeholder="조 개수"><br>
    <button onclick="createRoom()">방 생성 및 시작</button>
    <br><button onclick="location.reload()" style="background-color:#7f8c8d; margin-top:10px;">뒤로 가기</button>
  </div>

  <!-- 게임 대시보드 (호스트) -->
  <div id="view-host" class="card hidden">
    <h2 id="host-room-title">호스트 제어판</h2>
    <div style="margin-top: 20px;">
      <p>Firebase와 연동되어 정적 페이지로 방이 생성되었습니다.</p>
    </div>
  </div>

  <script>
    let currentRoomCode = '';

    function showCreateRoom() {
      document.getElementById('view-select').classList.add('hidden');
      document.getElementById('view-create').classList.remove('hidden');
    }

    function showJoinRoom() {
      const roomCode = prompt("참가할 방 코드를 입력하세요:");
      if (!roomCode) return;
      currentRoomCode = roomCode.trim().toUpperCase();
      alert(currentRoomCode + " 방으로 진입합니다.");
    }

    async function createRoom() {
      const roomCode = document.getElementById('input-room-code').value.trim().toUpperCase();
      const teamsCount = parseInt(document.getElementById('input-teams-count').value);
      if (!roomCode) {
        alert("방 코드를 입력해주세요.");
        return;
      }

      const { doc, setDoc, getDoc } = window.firebaseFns;
      const roomRef = doc(window.db, "rooms", roomCode);
      const snap = await getDoc(roomRef);

      if (snap.exists()) {
        alert("이미 존재하는 방 코드입니다.");
        return;
      }

      // 초기 방 데이터 생성
      await setDoc(roomRef, {
        teamsCount,
        teams: {},
        players: {},
        teamScores: {},
        currentWord: ''
      });

      currentRoomCode = roomCode;
      document.getElementById('view-create').classList.add('hidden');
      document.getElementById('view-host').classList.remove('hidden');
      document.getElementById('host-room-title').innerText = `방 코드: ${roomCode} (호스트 제어판)`;
    }
  </script>
</body>
</html>
